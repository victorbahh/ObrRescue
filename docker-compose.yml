# Run from this repo (ObrRescue). It must sit in a colcon workspace's src/ folder next to the
# hero repo (src/ObrRescue, src/hero). The whole src/ folder is mounted as ~/ws/src.
name: obr
services:
  ros:
    build: .
    image: obr/ros-jazzy-gz
    container_name: ros-jazzy
    network_mode: host
    ipc: host
    tty: true
    stdin_open: true
    devices:
      - /dev/dxg               # WSL2 GPU (D3D12) device
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
      - /usr/lib/wsl:/usr/lib/wsl:ro
      - ..:/home/ubuntu/ws/src   # parent of this repo = workspace src/ (ObrRescue + hero)
    environment:
      - DISPLAY=${DISPLAY:-:0}
      - WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-wayland-0}
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - PULSE_SERVER=/mnt/wslg/PulseServer
      - LD_LIBRARY_PATH=/usr/lib/wsl/lib
      - GALLIUM_DRIVER=d3d12
      - MESA_D3D12_DEFAULT_ADAPTER_NAME=NVIDIA
      - QT_X11_NO_MITSHM=1
      - ROS_DOMAIN_ID=0
    command: sleep infinity
