controller_server:
  ros__parameters:
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.5
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.03
      movement_time_allowance: 20.0
    goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.04
      yaw_goal_tolerance: 0.2
      stateful: true
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      min_vel_x: -0.025
      max_vel_x: 0.04
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.04
      min_speed_theta: 0.0
      acc_lim_x: 0.4
      decel_lim_x: -0.4
      acc_lim_theta: 2.0
      decel_lim_theta: -2.0
      vx_samples: 12
      vy_samples: 1
      vtheta_samples: 20
      sim_time: 2.0
      linear_granularity: 0.01
      angular_granularity: 0.05
      transform_tolerance: 0.3
      xy_goal_tolerance: 0.04
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.08
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.04
      GoalAlign.scale: 20.0
      GoalAlign.forward_point_distance: 0.04
      PathDist.scale: 24.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 20.0
      RotateToGoal.slowing_factor: 3.0
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.01
      robot_radius: 0.045
      transform_tolerance: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /laser
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 0.2
          obstacle_max_range: 1.95
          raytrace_max_range: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.10
        cost_scaling_factor: 12.0
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.045
      resolution: 0.01
      track_unknown_space: true
      transform_tolerance: 0.3
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        observation_sources: scan
        scan:
          topic: /laser
          data_type: LaserScan
          marking: true
          clearing: true
          inf_is_valid: true
          min_obstacle_height: 0.0
          max_obstacle_height: 0.2
          obstacle_max_range: 1.95
          raytrace_max_range: 2.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.10
        cost_scaling_factor: 12.0
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner::NavfnPlanner
      tolerance: 0.03
      use_astar: false
      allow_unknown: false

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    navigators: [navigate_to_pose]
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator

collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_nav
    cmd_vel_out_topic: cmd_vel
    source_timeout: 0.5
    transform_tolerance: 0.3
    stop_pub_timeout: 1.0
    polygons: [StopZone]
    StopZone:
      type: velocity_polygon
      holonomic: false
      velocity_polygons: [rotation, forward, reverse]
      rotation:
        points: '[[0.055, 0.055], [0.055, -0.055], [-0.055, -0.055], [-0.055, 0.055]]'
        linear_min: -0.001
        linear_max: 0.001
        theta_min: -10.0
        theta_max: 10.0
      forward:
        points: '[[0.065, 0.055], [0.065, -0.055], [-0.055, -0.055], [-0.055, 0.055]]'
        linear_min: 0.001
        linear_max: 1.0
        theta_min: -10.0
        theta_max: 10.0
      reverse:
        points: '[[0.055, 0.055], [0.055, -0.055], [-0.065, -0.055], [-0.065, 0.055]]'
        linear_min: -1.0
        linear_max: -0.001
        theta_min: -10.0
        theta_max: 10.0
      action_type: stop
      min_points: 2
      visualize: false
      enabled: true
    observation_sources: [scan]
    scan:
      type: scan
      topic: /laser
      enabled: true